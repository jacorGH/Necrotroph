<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#17140f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Necrotroph">
<title>Necrotroph</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js" defer></script>
<style>
:root{
  --loam:#17140f; --panel:rgba(30,25,19,.9); --panel2:#2a231a; --line:rgba(236,227,208,.12);
  --bone:#ece3d0; --mute:#9a8f7c; --ichor:#ff5e8a; --good:#8fe388; --warn:#f2b441; --bad:#ff5a4e;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--loam);color:var(--bone);overflow:hidden;overscroll-behavior:none;
  font-family:Oxanium,ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--ichor);outline-offset:2px}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hide{display:none!important}

/* HUD */
#hud{position:fixed;inset:0;pointer-events:none}
#top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:12px;
  padding:calc(var(--sat) + 6px) calc(var(--sar) + 10px) 14px calc(var(--sal) + 10px);
  background:linear-gradient(rgba(23,20,15,.95),rgba(23,20,15,.6) 65%,transparent)}
#top>*{pointer-events:auto}
.ib{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;cursor:pointer}
.stat{display:flex;align-items:center;gap:7px;font-weight:600;font-size:16px;font-variant-numeric:tabular-nums}
.gem{width:10px;height:10px;transform:rotate(45deg);background:var(--ichor);display:inline-block;border-radius:2px;box-shadow:0 0 10px var(--ichor)}
.supi{width:12px;height:12px;border:2px solid var(--bone);border-radius:50%;display:inline-block;opacity:.75}
#tRace{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flex{flex:1}
#tNet{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
#tNet i{width:9px;height:9px;border-radius:50%;background:var(--mute)}
#tNet.on i{background:var(--good);box-shadow:0 0 8px var(--good)}
#tNet.wob i{background:var(--warn)}
#tNet.off i{background:var(--bad)}
#mini{position:absolute;right:calc(var(--sar) + 10px);top:calc(var(--sat) + 56px);width:112px;height:112px;border:1px solid var(--line);border-radius:12px;background:#0f0d0a;pointer-events:auto;touch-action:none}
#bar{position:absolute;left:0;right:0;bottom:0;display:flex;gap:5px;justify-content:center;pointer-events:auto;
  padding:18px calc(var(--sar) + 8px) calc(var(--sab) + 8px) calc(var(--sal) + 8px);
  background:linear-gradient(transparent,rgba(23,20,15,.94) 40%)}
#bar button{flex:1;max-width:86px;min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--panel);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;position:relative;padding:4px 2px}
#bar button svg{width:21px;height:21px}
#bar button small{font-size:10.5px;color:var(--mute);letter-spacing:.02em}
#bar button.on{border-color:var(--ichor);background:rgba(255,94,138,.16)}
#bar button.on small{color:var(--bone)}
#bar em{position:absolute;top:3px;right:5px;font-style:normal;font-size:10px;background:var(--warn);color:#1b1408;border-radius:8px;padding:0 5px;font-weight:800}
#ctx{position:absolute;left:calc(var(--sal) + 8px);right:calc(var(--sar) + 8px);bottom:calc(var(--sab) + 80px);pointer-events:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);max-width:640px;margin:0 auto}
#ctx:empty{display:none}
.prow{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.prow::-webkit-scrollbar{display:none}
.pb{flex:0 0 auto;width:84px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);padding:5px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer}
.pb img{width:36px;height:36px}
.pb .nm{font-size:11px;font-weight:600;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.pb .cs{font-size:11px;color:var(--mute);display:flex;align-items:center;gap:5px}
.pb .cs .gem{width:6px;height:6px;box-shadow:none}
.pb[disabled]{opacity:.42}
.pb.grow{border-style:dashed}
.qrow{display:flex;align-items:center;gap:6px;margin-top:7px;min-height:30px}
.qs{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:#1a1611;position:relative;overflow:hidden;cursor:pointer}
.qs img{width:100%;height:100%}
.qs b{position:absolute;left:0;bottom:0;height:3px;background:var(--ichor)}
.qlab{font-size:11.5px;color:var(--mute);flex:1;line-height:1.25}
.tog{border-radius:9px;border:1px solid var(--line);background:var(--panel2);font-size:11.5px;padding:7px 9px;cursor:pointer;white-space:nowrap}
.tog.on{border-color:var(--good);color:var(--good)}
.uinfo{display:flex;align-items:center;gap:10px;font-size:13px}
.uinfo img{width:38px;height:38px}
.uinfo .t{flex:1;line-height:1.3}
.uinfo .t span{color:var(--mute);font-size:12px}
#netBanner{position:absolute;left:50%;top:calc(var(--sat) + 60px);transform:translateX(-50%);width:min(92vw,420px);pointer-events:auto;
  background:var(--panel);border:1px solid var(--warn);border-radius:14px;padding:12px 14px;text-align:center;font-size:13.5px;line-height:1.4}
#netBanner .acts{display:flex;gap:8px;justify-content:center;margin-top:10px}
#toast{position:fixed;left:50%;bottom:calc(var(--sab) + 300px);transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:9px 14px;font-size:13.5px;pointer-events:none;opacity:0;transition:opacity .2s;z-index:30;max-width:86vw;text-align:center}
#toast.show{opacity:1}
#hint{position:absolute;left:50%;top:calc(var(--sat) + 60px);transform:translateX(-50%);width:min(92vw,400px);pointer-events:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:13.5px;line-height:1.55}
#hint b{color:var(--ichor);font-weight:600}
#hint button{margin-top:8px}

/* Screens */
#scr{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:20;overflow-y:auto;touch-action:pan-y;
  padding:calc(var(--sat) + 18px) calc(var(--sar) + 14px) calc(var(--sab) + 18px) calc(var(--sal) + 14px);
  background:radial-gradient(ellipse at 50% 40%,rgba(23,20,15,.35),rgba(23,20,15,.88) 75%)}
.card{width:min(100%,460px);margin:auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px 20px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.card.wide{width:min(100%,720px)}
.logo{text-align:center;margin-bottom:16px}
.logo img{width:84px;height:84px;border-radius:20px;display:block;margin:0 auto 10px}
h1{font-size:44px;line-height:1;margin:0;font-weight:800;letter-spacing:-.02em;
  background:linear-gradient(100deg,#9b5de5 0%,#e3a32b 33%,#36d6e7 66%,#ff7a45 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{margin:8px 0 0;color:var(--mute);font-size:15px}
h2{margin:0 0 14px;font-size:22px;font-weight:600}
.btn{display:block;width:100%;min-height:50px;border-radius:13px;border:1px solid var(--line);background:var(--panel2);font-size:16px;font-weight:600;margin:8px 0;cursor:pointer;padding:0 14px}
.btn.prime{background:var(--ichor);border-color:var(--ichor);color:#2a0612}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45}
.fine{font-size:12px;color:var(--mute);text-align:center;margin:14px 0 0;line-height:1.5}
.races{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.race{text-align:left;border-radius:14px;border:1px solid var(--line);background:var(--panel2);padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.race img{width:44px;height:44px}
.race b{font-size:16px;color:var(--rc)}
.race span{font-size:12px;color:var(--mute);line-height:1.4}
.race.on{border-color:var(--rc);box-shadow:inset 0 0 0 1px var(--rc)}
.row{margin-top:14px}
.row label{display:block;font-size:13px;color:var(--mute);margin-bottom:6px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border-radius:10px;border:1px solid var(--line);background:var(--panel2);padding:9px 11px;font-size:13px;cursor:pointer}
.seg button.on{border-color:var(--ichor);color:var(--ichor)}
input#code{width:100%;min-height:52px;border-radius:12px;border:1px solid var(--line);background:#120f0b;color:var(--bone);font:600 26px Oxanium,monospace;
  letter-spacing:.3em;text-align:center;text-transform:uppercase;user-select:text;-webkit-user-select:text}
.actions{display:flex;gap:8px;margin-top:16px}
.actions .btn{margin:0}
.code{font-size:56px;font-weight:800;letter-spacing:.18em;text-align:center;margin:6px 0 10px;color:var(--ichor)}
.status{font-size:14px;color:var(--mute);text-align:center;min-height:20px;line-height:1.5}
.status b{color:var(--bone)}
.codex h3{margin:18px 0 6px;font-size:17px}
.codex p{margin:4px 0;font-size:13.5px;line-height:1.5;color:#d6ccb8}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:6px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--mute);font-weight:600}
td.c{text-align:center}
.end h2{font-size:34px;text-align:center;margin-bottom:6px}
.end .sub{text-align:center;color:var(--mute);margin-bottom:12px}
@media (min-width:900px){ #ctx{bottom:calc(var(--sab) + 84px)} }
@media (prefers-reduced-motion:reduce){ #toast{transition:none} }

input,input.txt{width:100%;min-height:46px;border-radius:12px;border:1px solid var(--line);background:#120f0b;color:var(--bone);font:600 16px Oxanium,sans-serif;padding:0 12px}
textarea{user-select:text;-webkit-user-select:text}
.pb.ab{width:auto;min-width:120px;flex-direction:row;gap:8px;padding:6px 10px;border-color:var(--rc,var(--line))}
.pb.ab .nm{font-size:12.5px}
.uacts{display:flex;gap:6px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.uacts .tog{flex:0 0 auto}
.maps{display:flex;gap:10px;align-items:flex-start}
.maps img{width:96px;height:96px;border-radius:10px;border:1px solid var(--line);image-rendering:pixelated;flex:0 0 auto;background:#0f0d0a}
.maps .seg{flex:1}
/* Editor */
#edhud{position:fixed;inset:0;pointer-events:none}
#edtop{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:8px;pointer-events:auto;
  padding:calc(var(--sat) + 6px) calc(var(--sar) + 10px) 12px calc(var(--sal) + 10px);background:linear-gradient(rgba(23,20,15,.95),rgba(23,20,15,.6) 70%,transparent)}
#edName{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#edpal{position:absolute;left:0;right:0;bottom:0;pointer-events:auto;padding:16px calc(var(--sar) + 8px) calc(var(--sab) + 8px) calc(var(--sal) + 8px);
  background:linear-gradient(transparent,rgba(23,20,15,.95) 30%)}
#edTools{gap:5px}
.et{flex:0 0 auto;min-width:62px;height:56px;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;cursor:pointer;padding:0 6px}
.et i{width:20px;height:14px;border-radius:4px;display:block}
.et.on{border-color:var(--ichor);background:rgba(255,94,138,.16)}
.edrow{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--mute)}
.edrow .seg button{padding:7px 12px}
textarea{width:100%;min-height:140px;border-radius:12px;border:1px solid var(--line);background:#120f0b;color:var(--bone);font:12px/1.4 ui-monospace,monospace;padding:10px}
.mlist{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.mitem{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:8px;background:var(--panel2)}
.mitem img{width:44px;height:44px;border-radius:8px;image-rendering:pixelated}
.mitem b{flex:1;font-size:14px}
.warn{color:var(--warn)}.bad{color:var(--bad)}

.ess{width:9px;height:12px;display:inline-block;background:#9dff6a;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;box-shadow:0 0 8px rgba(157,255,106,.7);vertical-align:-1px}
.pb .cs .ess{width:6px;height:8px;box-shadow:none}
.tabs{display:flex;gap:6px;margin-bottom:8px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;border-radius:10px;border:1px solid var(--line);background:var(--panel2);padding:7px 12px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px}
.tabs button img{width:22px;height:22px}
.tabs button.on{border-color:var(--ichor);color:var(--ichor)}
.pb.up{width:150px;align-items:flex-start;text-align:left;padding:8px}
.pb .ud{font-size:10.5px;color:var(--mute);line-height:1.3;white-space:normal;margin:2px 0 4px;text-align:center}
.pb.up .ud{text-align:left}
.pb.grow{width:104px}
.pb .cs{white-space:nowrap}
.pb.up.done{border-color:var(--good);opacity:.7}
.pb.up.busy{border-color:var(--warn)}
#groups{position:absolute;right:calc(var(--sar) + 10px);top:calc(var(--sat) + 176px);display:flex;flex-direction:column;gap:6px;pointer-events:auto}
#groups button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-weight:800;font-size:15px;position:relative;cursor:pointer;touch-action:none;-webkit-touch-callout:none}
#groups button.on{border-color:var(--good)}
#groups em{position:absolute;bottom:2px;right:4px;font-style:normal;font-size:10px;color:var(--good);font-weight:600}
#tut{position:absolute;left:calc(var(--sal) + 10px);top:calc(var(--sat) + 56px);width:min(calc(100vw - 150px),380px);pointer-events:auto;background:var(--panel);border:1px solid #ffe08a55;border-radius:14px;padding:10px 12px;font-size:13px;line-height:1.45}
#tut .tt{display:flex;justify-content:space-between;gap:8px;margin-bottom:4px}
#tut .tt b{color:#ffe08a}
#tut .tt span{color:var(--mute);font-size:12px;white-space:nowrap}
#tut .acts{display:flex;gap:6px;margin-top:8px}
.slot{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:6px 8px;margin:6px 0;background:var(--panel2);flex-wrap:wrap}
.slot b{flex:1;font-size:13.5px;font-weight:600;min-width:100px}
.slot.open b,.slot.closed b{color:var(--mute);font-weight:400}
.team{width:34px;height:34px;border-radius:9px;border:0;font-weight:800;color:#1b1408;display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
.team.t0{background:#8fe388}.team.t1{background:#ff7a6e}.team.t2{background:#6ebeff}.team.t3{background:#ffd34e}
.race.add{border-style:dashed;justify-content:center}
.race.add b{color:var(--ichor)}
.sl{margin:10px 0}
.sl label{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin-bottom:4px}
.sl label b{color:var(--bone);font-weight:600}
input[type=range]{width:100%;accent-color:var(--ichor);height:28px}
input[type=color]{width:56px;height:40px;border:1px solid var(--line);border-radius:10px;background:none;padding:2px}
.unitpane{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.unitpane canvas{width:120px;height:120px;border-radius:14px;border:1px solid var(--line);flex:0 0 auto}
.price{font-size:13px;color:var(--mute);line-height:1.5;margin-top:8px}
.price b{color:var(--bone);font-size:16px}
.band{position:relative;height:8px;border-radius:4px;margin:6px 0;background:linear-gradient(90deg,#3a3024,#6a5c49)}
.band i{position:absolute;top:-3px;width:4px;height:14px;border-radius:2px;background:var(--ichor);transform:translateX(-50%)}
.rb .seg button{padding:8px 10px}
.rb textarea{font:14px/1.5 Oxanium,ui-rounded,system-ui,sans-serif}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud" class="hide">
  <div id="top">
    <button class="ib" id="bMenu" aria-label="Menu"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <div class="stat" title="Matter"><i class="gem"></i><b id="tMat">0</b></div>
    <div class="stat" title="Essence"><i class="ess"></i><b id="tEss">0</b></div>
    <div class="stat" title="Supply"><i class="supi"></i><b id="tSup">0/0</b></div>
    <div id="tRace"></div>
    <div class="flex"></div>
    <div id="tNet" class="hide"><i></i><span></span></div>
  </div>
  <canvas id="mini"></canvas>
  <div id="groups"><button data-g="0">1<em></em></button><button data-g="1">2<em></em></button><button data-g="2">3<em></em></button></div>
  <div id="tut" class="hide"></div>
  <div id="ctx"></div>
  <div id="bar">
    <button data-b="box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="3 2.4"><rect x="4" y="4" width="16" height="16" rx="2"/></svg><small>Box</small></button>
    <button data-b="army"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 19L17 7m0 0V4h3v3h-3M19 19L7 7m0 0V4H4v3h3M8 16l-2 2m10-2l2 2"/></svg><small>Army</small></button>
    <button data-b="work"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 10L5 19M9 4c4 0 8 2 11 6M12 5.5c2.5 1 4.6 2.8 6 5.2"/></svg><small>Workers</small><em id="idleB" class="hide"></em></button>
    <button data-b="amove"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="15" cy="9" r="5"/><circle cx="15" cy="9" r="1.5" fill="currentColor"/><path d="M4 20l7.5-7.5"/></svg><small>A-Move</small></button>
    <button data-b="stop"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg><small>Stop</small></button>
    <button data-b="core"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><circle cx="12" cy="12" r="2.5"/></svg><small>Core</small></button>
    <button data-b="clear"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg><small>Clear</small></button>
  </div>
  <div id="netBanner" class="hide"></div>
  <div id="hint" class="hide"></div>
</div>


<div id="edhud" class="hide">
  <div id="edtop">
    <button class="ib" id="edMenu" aria-label="Designer menu"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <div id="edName"></div>
    <div class="flex"></div>
    <button class="tog" id="edUndo">Undo</button>
    <button class="tog" id="edSym">Mirror: rotate</button>
    <button class="tog on" id="edTest">Test</button>
  </div>
  <div id="edpal">
    <div class="prow" id="edTools"></div>
    <div class="edrow"><span>Brush</span><div class="seg" id="edBrush"></div><span id="edInfo" style="margin-left:auto"></span></div>
  </div>
</div>

    const pts = [[x, y]]; if (sym) pts.push(symPt(m, x, y, sym));
    const near = a => pts.some(p => Math.hypot(a[0] - p[0], a[1] - p[1]) < 70);
    const before = m.blooms.length + m.lairs.length;
    m.blooms = m.blooms.filter(b => !near(b)); m.lairs = m.lairs.filter(l => !near(l));
    if (m.starts.length > 2) { const keep = m.starts.filter(st => !near(st)); if (keep.length >= 2 && keep.length < m.starts.length) { m.starts = keep; ED.nextStart = keep.length % 4; toast('Base removed'); } }
    if (before === m.blooms.length + m.lairs.length && !/Base removed/.test($('toast').textContent)) { ED.undo.pop(); toast('Tap a bloom or lair to erase it. Paint Ground to clear terrain.'); }
  }
  edBuildUI();
}
function edPlaceBase(m, x, y, sym) {
  if (sym) { m.starts = [[x, y], ...symPts(m, x, y, sym)]; toast(`Placed ${m.starts.length} bases (kept clear of the edge)`); }
  else { if (ED.nextStart >= m.starts.length) ED.nextStart = m.starts.length; m.starts[ED.nextStart] = [x, y]; toast(`Placed base ${ED.nextStart + 1}`); ED.nextStart = (ED.nextStart + 1) % 4; }
  edBuildUI();
}

function edAction(a, v) {
  switch (a) {
    case 'ed-menu': edMenu(); return true;
    case 'ed-close': hideScr(); edBuildUI(); return true;
    case 'ed-save': {
      const fatal = validateMap(ED.map).filter(i => i.fatal);
      if (saveCustomMap(ED.map)) { ED.saved = true; delete THUMBS[ED.map.id]; toast(fatal.length ? `Saved. Before playing: ${fatal[0].msg}` : 'Map saved'); }
      else toast('Could not save. Storage may be full.');
      hideScr(); edBuildUI(); return true;
    }
    case 'ed-test': hideScr(); edTest(); return true;
    case 'ed-open': edOpenScreen(); return true;
    case 'ed-load': {
      const bi = BUILTIN_MAPS.find(b => b.id === v);
      let m;
      if (bi) { m = cloneMap(builtinMap(v, 2)); m.id = uid(); m.name = bi.name + ' copy'; }
      else m = getMap(v);
      openEditor(m); ED.saved = !bi; edBuildUI(); return true;
    }
    case 'ed-del': deleteCustomMap(v); delete THUMBS[v]; if (App.mapId === v) App.mapId = 'basin'; edOpenScreen(); toast('Map deleted'); return true;
    case 'ed-new': { const m = blankMap(+v, 'New map'); const S = m.n * TILE; m.starts = [[420, S - 420], [S - 420, 420]]; openEditor(m); ED.saved = false; edBuildUI(); return true; }
    case 'ed-gen': { const m = genRandomMap((Math.random() * 1e9) | 0, ED.map.n, ED.sym === 'quad' ? 4 : 2); m.name = 'Generated map'; openEditor(m); ED.saved = false; edBuildUI(); return true; }
    case 'ed-export': edExportScreen(); return true;
    case 'ed-import': edImportScreen(); return true;
    case 'ed-copy': { const t = $('expTxt'); if (navigator.clipboard) navigator.clipboard.writeText(t.value).then(() => toast('Copied')).catch(() => { t.select(); toast('Select the text and copy it'); }); else { t.select(); toast('Select the text and copy it'); } return true; }
    case 'ed-share': { const t = $('expTxt').value; if (navigator.share) navigator.share({ title: ED.map.name, text: t }).catch(() => {}); else toast('Sharing is not available here. Use Copy instead.'); return true; }
    case 'ed-dl': {
      const blob = new Blob([$('expTxt').value], { type: 'application/json' }), a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = ED.map.name.replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '-').toLowerCase() + '.lifecycles.json';
      document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); return true;
    }
    case 'ed-doimport': {
      try { const m = mapFromJSON(JSON.parse($('impTxt').value)); m.id = uid(); openEditor(m); ED.saved = false; edBuildUI(); toast(`Imported ${m.name}. Save it to keep it.`); }
      catch (e) { toast('That text is not a LifeCycles map'); }
      return true;
    }
    case 'ed-exit': App.editing = false; $('edhud').classList.add('hide'); startDemo(); menuScreen(); return true;
  }
  return false;
}

function prepareRaces(slots) {
  const list = [];
  slots.forEach((s, i) => {
    if (!s.race || s.race === 'random') s.race = BASE_RACES[Math.random() * 4 | 0];
    if (isCustomPick(s.race)) { const def = customDefFor(s.race); if (!def) { s.race = 'kytinos'; return; } list.push({ key: 'x' + i, def }); s.race = 'x' + i; }
    else if (s.def) { list.push({ key: 'x' + i, def: s.def }); s.race = 'x' + i; delete s.def; }
  });
  try { registerMatchRaces(list); } catch (e) { toast(e.message); return false; }
  App.matchCustom = list;
  return true;
}

function startGame(seat) {
  App.inGame = true; App.editing = false; App.seat = seat; App.sel.clear(); App.endShown = false; App.elimShown = false; App.paused = false; App.amove = false; App.boxMode = false; App.place = false;
  genDecor(App.role === 'guest' ? G.seed : W.seed);
  hideScr(); $('hud').classList.remove('hide'); $('edhud').classList.add('hide');
  const s = V.starts()[seat] || [MAP_W / 2, MAP_H / 2];
  cam.z = Math.max(0.8, Math.min(1.4, Math.min(vw, vh) / 430));
  centerOn(s[0] + (MAP_W / 2 - s[0]) * 0.12, s[1] + (MAP_H / 2 - s[1]) * 0.12);
  localFx = []; markers = []; fogDrawn = -1; UI.ctxDirty = true; UI.coreTab = 'train'; UI.lastUp = ''; UI.bar(); UI.netState(); Groups.reset();
  $('tut').classList.toggle('hide', !App.tut);
  SFX.unlock(); Music.setTheme(V.race(seat)); Music.target = 0.2;
  if (!App.tut && !LS.get('lc.hint3')) {
    const h = $('hint'); h.classList.remove('hide');
    h.innerHTML = `<b>Drag</b> to pan, <b>pinch</b> to zoom. <b>Tap</b> a unit, then tap the ground to move or an enemy to attack. <b>Hold and drag</b> to box-select. <b>Hold a group button</b> on the right to save a squad. Tap your <b>core</b> to train and evolve. Corpses give <b>Essence</b> for upgrades and elite units. New here? Try the Tutorials.<br><button class="tog" id="hintOk">Got it</button>`;
    $('hintOk').onclick = () => { h.classList.add('hide'); LS.set('lc.hint3', 1); };
  }
}
function startSolo() {
  const slots = App.skirmish.map((s, i) => s.kind === 'you' ? { race: myRaceKey(), team: s.team, name: App.name() } : { race: s.race, team: s.team, ai: s.diff, name: 'AI ' + i });
  const you = App.skirmish.findIndex(s => s.kind === 'you');
  if (new Set(slots.map(s => s.team)).size < 2) return toast('Everyone is on the same team. Tap a team letter to change it.');
  const m = mapList().find(x => x.id === App.mapId);
  if (m && m.max < slots.length) return toast(`${m.name} only has ${m.max} bases. Pick a bigger map.`);
  // keep teammates adjacent on four-base maps
  const order = slots.map((s, i) => i).sort((a, b) => slots[a].team - slots[b].team || a - b);
  const sorted = order.map(i => slots[i]);
  if (!prepareRaces(sorted)) return;
  newWorld(sorted, { map: getMap(App.mapId, sorted.length), fog: App.fog, custom: App.matchCustom });
  App.role = 'solo'; App.returnTo = ''; App.tut = null;
  startGame(order.indexOf(you)); saveSession(); saveWorld();
}
async function startHost() {
  if (!peerReady()) return toast('PeerJS did not load. Check your connection and reload.');
  netShutdown(); Net.aborted = false; Net.role = 'host'; App.role = 'demo'; App.pickMode = 'host-lobby';
  Host.reset();
  for (let i = 0; i < 4; i++) {
    Net.code = genCode();
    if (i === 0) hostLobby(); else { const c = scr.querySelector('.code'); if (c) c.textContent = Net.code; }
    try { await ensureSignal(); hostLobby(); return; }
    catch (e) {
      try { Net.peer && Net.peer.destroy(); } catch (_) {} Net.peer = null;
      if (Net.aborted) return;
      if (!(e && e.type === 'unavailable-id')) { const s = $('lobStat'); if (s) s.textContent = 'Could not reach the PeerJS server. Check your connection and try again.'; return; }
    }
  }
}
function hostStart() {
  const why = hostStartProblem(); if (why) return toast(why);
  const ps = Host.slots.map((s, i) => ({ s, i })).filter(({ s }) => s.kind === 'host' || s.kind === 'guest' || s.kind === 'ai');
  ps.sort((a, b) => a.s.team - b.s.team || a.i - b.i);
  const slots = ps.map(({ s, i }, k) => {
    s.seat = k;
    if (i === 0) return { race: myRaceKey(), team: s.team, name: App.name() };
    if (s.kind === 'guest') return s.def ? { def: s.def, team: s.team, name: s.name } : { race: s.race, team: s.team, name: s.name };
    return { race: s.race || 'random', team: s.team, ai: s.ai || 'normal', name: 'AI' };
  });
  if (!prepareRaces(slots)) return;
  Host.inGame = true;
  newWorld(slots, { map: getMap(App.mapId, slots.length), fog: App.fog, custom: App.matchCustom });
  App.role = 'host'; App.returnTo = ''; App.tut = null;
  startGame(Host.slots[0].seat);
  for (const k in lastVis) delete lastVis[k];
  Host.slots.forEach((s, i) => { if (s.kind === 'guest') sendInit(i); });
  for (const s of Host.slots) if (s.kind === 'open') s.kind = 'closed';
  Host.refreshState(); saveSession(); saveWorld();
}
async function startJoin(code) {
  code = (code || '').toUpperCase().trim();
  if (code.length !== 4) return toast('Enter the 4-character room code');
  if (!peerReady()) return toast('PeerJS did not load. Check your connection and reload.');
  if (isCustomPick(App.myRace)) { const v = validateRace(customDefFor(App.myRace)); if (!v.ok) return toast('Your race needs fixing first: ' + v.errs[0]); }
  netShutdown(); Net.aborted = false;
  Net.role = 'guest'; Net.code = code; Net.token = rid(12); App.role = 'demo';
  joinWait(code);
  let tries = 0;
  while (!Net.linked && !Net.aborted && tries++ < 4) {
    try { await ensureSignal(); await dial(9000); }
    catch (e) {
      const t = (e && (e.type || e.message)) || '';
      const s = $('joinStat');
      if (String(t).startsWith('deny:')) { if (s) s.textContent = t.slice(5); netShutdown(); return; }
      if (s) s.textContent = t === 'peer-unavailable' ? `No room ${code} yet. Retrying (${tries}/4)…` : `Still trying (${tries}/4)…`;
      await sleep(1200 * tries);
    }
  }
  if (!Net.linked && !Net.aborted) { const s = $('joinStat'); if (s) s.textContent = `Could not find room ${code}. Check the code and that the host is still waiting.`; }
}
function shareRoom() {
  const url = location.href.split(/[?#]/)[0] + '?join=' + Net.code;
  if (navigator.share) navigator.share({ title: 'Necrotroph', text: `Join my Necrotroph match. Room ${Net.code}`, url }).catch(() => {});
  else if (navigator.clipboard) navigator.clipboard.writeText(url).then(() => toast('Invite link copied')).catch(() => toast(url));
  else toast(url);
}
function resumeMatch() {
  const s = resumeAvailable(); if (!s) { menuScreen(); return; }
  App.myRace = s.race;
  if (s.role === 'solo') { restoreWorld(s.world.W); App.role = 'solo'; App.tut = null; startGame(s.seat || 0); toast('Skirmish resumed'); return; }
  if (!peerReady()) return toast('PeerJS did not load. Check your connection and reload.');
  netShutdown(); Net.aborted = false; Net.role = s.role; Net.code = s.code; Net.token = s.token;
  if (s.role === 'host') {
    restoreWorld(s.world.W);
    Host.inGame = true;
    Host.slots = s.world.host.map(x => Object.assign({ conn: null, linked: false, ping: 0 }, x));
    App.role = 'host'; App.tut = null; startGame(s.seat || 0);
    Host.refreshState('host reloaded');
    hostWait();
  } else {
    App.role = 'guest'; G.units.clear(); G.list = [];
    joinWait(s.code);
    recover(120000);
  }
}
function quitToMenu() {
  if (Net.role === 'guest') netSend({ t: 'bye' });
  if (Net.role === 'host') for (const s of Host.slots) if (s.conn && s.linked) { try { s.conn.send({ t: 'bye' }); } catch (e) {} }
  const hadNet = !!Net.role;
  if (hadNet) setTimeout(netShutdown, 150);
  clearSaved();
  const back = App.returnTo === 'editor' && ED.map, tut = !!App.tut;
  App.inGame = false; App.role = 'demo'; App.sel.clear(); App.paused = false; App.returnTo = ''; App.tut = null;
  W = null; G.units.clear(); G.list = []; G.over = -1;
  $('hud').classList.add('hide'); $('hint').classList.add('hide'); $('tut').classList.add('hide');
  if (back) { openEditor(ED.map); ED.saved = false; edBuildUI(); return; }
  setTimeout(() => { startDemo(); tut ? tutorialsScreen() : menuScreen(); }, hadNet ? 170 : 0);
}

      case 'alert': this.tone(740, 0.15, 'square', 0.05); this.tone(554, 0.2, 'square', 0.05, 0, 0.17); break;
      case 'win': [392, 494, 587, 784].forEach((f, i) => this.tone(f, 0.5, 'triangle', 0.06, 0, i * 0.14)); break;
      case 'lose': [330, 262, 196].forEach((f, i) => this.tone(f, 0.6, 'sawtooth', 0.04, f * 0.8, i * 0.2)); break;
    }
  }
};

/* ================= MUSIC =================
   A generative soundtrack synthesized live. Each race has its own scale, tempo, chord
   cycle and instruments; a recurring motif keeps it recognisable. Intensity follows the
   fighting you can see: calm pads and sparse melody, then bass, then drums and arpeggios. */
const THEMES = {
  menu: { root: 50, scale: [0, 2, 3, 5, 7, 9, 10], bpm: 70, prog: [0, 5, 3, 4], lead: 'bell', pad: 'sawtooth', perc: 'soft', bass: 'sine', cap: 0.55 },
  necrosis: { root: 45, scale: [0, 1, 3, 5, 7, 8, 10], bpm: 78, prog: [0, 1, 0, 6], lead: 'choir', pad: 'sawtooth', perc: 'heavy', bass: 'sawtooth' },
  kytinos: { root: 52, scale: [0, 3, 5, 7, 10], bpm: 104, prog: [0, 2, 3, 0], lead: 'pluck', pad: 'square', perc: 'click', bass: 'triangle' },
  mechonized: { root: 48, scale: [0, 2, 3, 5, 7, 8, 11], bpm: 96, prog: [0, 5, 6, 4], lead: 'arp', pad: 'square', perc: 'electro', bass: 'square' },
  huminodiz: { root: 55, scale: [0, 2, 4, 5, 7, 9, 10], bpm: 90, prog: [0, 6, 3, 4], lead: 'tri', pad: 'triangle', perc: 'tribal', bass: 'triangle' }
};
const Music = {
  on: LS.get('nt.music') !== 0, bus: null, timer: 0, next: 0, step: 0, theme: THEMES.menu, key: 'menu', target: 0.1, level: 0.1, motif: [], last: 0,
  start() {
    const c = SFX.ctx; if (!c || this.bus) return;
    this.bus = c.createGain(); this.bus.gain.value = this.on ? 0.32 : 0;
    const comp = c.createDynamicsCompressor(); this.bus.connect(comp); comp.connect(c.destination);
    this.next = c.currentTime + 0.1; this.makeMotif();
    this.timer = setInterval(() => this.schedule(), 50);
  },
  set(on) { this.on = on; LS.set('nt.music', on ? 1 : 0); if (on) SFX.unlock(); if (this.bus) this.bus.gain.setTargetAtTime(on ? 0.32 : 0, SFX.ctx.currentTime, 0.3); },
  setTheme(key) {
    let k = key;
    if (!THEMES[k] && RACES[k]) { const R = RACES[k]; k = R.aura === 'raise' || R.feat.undead ? 'necrosis' : R.cls === 'mech' ? 'mechonized' : R.feat.bog || R.feat.devour ? 'kytinos' : 'huminodiz'; }
    if (!THEMES[k]) k = 'menu';
    if (k === this.key) return;
    this.key = k; this.theme = THEMES[k]; this.makeMotif(); this.step = 0; this.target = 0.15;
  },
  makeMotif() { const r = mulberry(this.key.length * 977 + 13); this.motif = Array.from({ length: 8 }, () => Math.floor(r() * 5) - 1); },
  notice(f) {
    if (f[0] !== 0 && f[0] !== 1 && f[0] !== 6 && f[0] !== 7) return;
    const hw = vw / 2 / cam.z + 300, hh = vh / 2 / cam.z + 300;
    if (Math.abs(f[1] - cam.x) > hw || Math.abs(f[2] - cam.y) > hh) return;
    this.target = Math.min(1, this.target + (f[0] === 1 ? 0.06 : 0.025));
  },
  midi(m) { return 440 * Math.pow(2, (m - 69) / 12); },
  note(deg, oct) { const sc = this.theme.scale, n = sc.length, d = ((deg % n) + n) % n, o = Math.floor(deg / n); return this.theme.root + sc[d] + 12 * (o + oct); },
  voice(type, m, t, dur, vol, cut, vib) {
    const c = SFX.ctx, o = c.createOscillator(), g = c.createGain(), f = c.createBiquadFilter();
    o.type = type; o.frequency.value = this.midi(m);
    if (vib) { const l = c.createOscillator(), lg = c.createGain(); l.frequency.value = 5; lg.gain.value = vib; l.connect(lg); lg.connect(o.frequency); l.start(t); l.stop(t + dur + 0.1); }
    f.type = 'lowpass'; f.frequency.value = cut || 3000;
    const a = Math.min(0.4, dur * 0.3);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + a); g.gain.setValueAtTime(vol, t + Math.max(a, dur - 0.15)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(f); f.connect(g); g.connect(this.bus); o.start(t); o.stop(t + dur + 0.05);
  },
  drum(kind, t, vol) {
    const c = SFX.ctx;
    if (kind === 'kick') { const o = c.createOscillator(), g = c.createGain(); o.frequency.setValueAtTime(130, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.18); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3); o.connect(g); g.connect(this.bus); o.start(t); o.stop(t + 0.32); return; }
    const s = c.createBufferSource(), fl = c.createBiquadFilter(), g = c.createGain(), dur = kind === 'hat' ? 0.05 : kind === 'click' ? 0.03 : 0.18;
    s.buffer = SFX.noise; fl.type = kind === 'hat' || kind === 'click' ? 'highpass' : 'bandpass'; fl.frequency.value = kind === 'hat' ? 7000 : kind === 'click' ? 3000 : kind === 'tom' ? 220 : 1400;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(fl); fl.connect(g); g.connect(this.bus); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
  },
  schedule() {
    const c = SFX.ctx; if (!c || !this.bus || !this.on) return;
    const base = App.inGame ? 0.15 : 0.08, cap = this.theme.cap || 1;
    this.target = Math.max(base, this.target * 0.985);
    this.level += (Math.min(cap, this.target) - this.level) * (this.target > this.level ? 0.03 : 0.008);
    if (this.next < c.currentTime - 0.5) this.next = c.currentTime + 0.05;
    const spb = 60 / (this.theme.bpm * (1 + this.level * 0.12)) / 4;
    while (this.next < c.currentTime + 0.25) { this.play(this.step, this.next, spb); this.next += spb; this.step++; }
  },
  play(step, t, spb) {
    const T = this.theme, I = this.level, s16 = step % 16, chordIdx = Math.floor(step / 32) % T.prog.length, deg = T.prog[chordIdx];
    if (step % 32 === 0) {
      const dur = spb * 32, cut = 500 + I * 1800;
      for (const k of [0, 2, 4]) { this.voice(T.pad, this.note(deg + k, 1), t, dur, 0.035, cut, 1.5); this.voice('sine', this.note(deg + k, 1) + 0.07, t, dur, 0.02, cut); }
    }
    if (I > 0.25 && s16 % 4 === 0) this.voice(T.bass, this.note(deg, -1), t, spb * (I > 0.6 ? 2 : 3.5), 0.09, 400 + I * 600);
    if (I > 0.6 && s16 % 4 === 2) this.voice(T.bass, this.note(deg, -1), t, spb * 1.5, 0.06, 500);
    const m = this.motif[(step >> 1) % 8];
    if (I < 0.5) {
      if (s16 % 4 === 0 && Math.random() < 0.28 + I * 0.5) this.lead(deg + m + (s16 === 8 ? 2 : 0), t, spb * 4, 0.05);
    } else if (step % 2 === 0) {
      const arp = [0, 2, 4, 7][(step >> 1) % 4];
      this.lead(deg + (Math.random() < 0.25 ? m : arp), t, spb * 2, 0.04);
    }
    if (I > 0.5) {
      const p = T.perc, v = 0.18 * Math.min(1, (I - 0.4) * 2);
      if (s16 === 0 || s16 === 8 || (I > 0.8 && s16 === 10)) this.drum(p === 'heavy' || p === 'tribal' ? 'tom' : 'kick', t, p === 'tribal' ? v * 1.2 : v * 1.4);
      if (p !== 'soft' && (s16 === 4 || s16 === 12)) this.drum(p === 'tribal' ? 'tom' : 'snare', t, v * 0.6);
      if (step % 2 === 1 || p === 'click') this.drum(p === 'click' ? 'click' : 'hat', t, v * (p === 'click' ? 0.35 : 0.25));
    } else if (I > 0.3 && s16 === 0) this.drum(T.perc === 'click' ? 'click' : 'kick', t, 0.06);
  },
  lead(deg, t, dur, vol) {
    const T = this.theme, n = this.note(deg, 2);
    switch (T.lead) {
      case 'bell': this.voice('sine', n, t, dur * 1.6, vol, 4000); this.voice('sine', n + 12, t, dur * 0.6, vol * 0.3, 5000); break;
      case 'choir': this.voice('sawtooth', n - 12, t, dur * 1.8, vol * 0.7, 900, 3); this.voice('sine', n, t, dur * 1.8, vol * 0.6, 2000, 4); break;
      case 'pluck': this.voice('square', n, t, Math.min(dur, 0.18), vol * 0.7, 1800); break;
      case 'arp': this.voice('sawtooth', n, t, Math.min(dur, 0.22), vol * 0.7, 2600); break;
      default: this.voice('triangle', n, t, dur * 1.2, vol * 1.2, 2500); this.voice('sine', n + 7, t, dur * 0.8, vol * 0.25, 2500);
    }
  }
};

/* ================= MAIN LOOP ================= */
let acc = 0, snapT = 0, lastCoreHp = 0, coreAlertT = 0;
function drainFx() {
  for (const f of W.fx) { pushFx(f); if (App.role === 'host') pendingFx.push(f); }
  if (pendingFx.length > 240) pendingFx.splice(0, pendingFx.length - 240);
  W.fx.length = 0;
  if (App.role !== 'host') W.tchg.length = 0;
}
// The simulation runs on a timer, separate from drawing, so a host whose tab loses focus keeps the match alive.
let simLast = performance.now();
function simPump() {
  const now = performance.now(), dt = Math.min(1, (now - simLast) / 1000); simLast = now;
  if (App.role === 'guest' || !W || App.editing || App.testing) return;
  const demo = App.role === 'demo';
  const run = W.over < 0 && !App.paused && !(App.role === 'host' && Net.state !== 'online');
  if (run) {
    acc += dt * (demo ? 0.8 : 1);
    let n = 0;
    while (acc >= STEP && n < 24) { tick(STEP); drainFx(); acc -= STEP; n++; }
    if (n >= 24) acc = 0;
  }
  if (App.role === 'host' && Host.inGame) { snapT += dt; if (snapT >= 0.1) { snapT = 0; hostBroadcast(); } }
}
setInterval(simPump, 25);
function frame(now) {
  requestAnimationFrame(frame);
  if (App.editing) {
    if (ED.dirtyTer) { loadTerrain(ED.map); ED.dirtyTer = false; }
    renderEditor(now);
    return;
  }
  if (App.role === 'demo' && W && !App.testing) {
    if (W.over >= 0 || W.time > 600) startDemo();
    const tx = MAP_W / 2 + Math.sin(now / 9000) * MAP_W * 0.2, ty = MAP_H / 2 + Math.cos(now / 11000) * MAP_H * 0.2;
    cam.x += (tx - cam.x) * 0.01; cam.y += (ty - cam.y) * 0.01;
  }
  if (W || V.guest()) render(now, App.role === 'guest' ? 0 : acc / STEP);
  if (App.inGame) {
    const over = V.over(), me = V.player(App.seat);
    if (over === -2 && !App.endShown) { App.endShown = true; setTimeout(() => endScreen(true, 'The host left the match.'), 600); }
    else if (over >= 0 && !App.endShown) { App.endShown = true; setTimeout(() => endScreen(over === V.myTeam()), 900); }
    else if (over < 0 && me && me.dead && !App.elimShown) { App.elimShown = true; setTimeout(elimScreen, 900); }
    const core = me && V.unit(me.core);
    if (core) {
      if (core.hp < lastCoreHp - 0.5 && now - coreAlertT > 10000) { coreAlertT = now; toast('Your core is under attack'); vibrate(80); SFX.ui('alert'); }
      lastCoreHp = core.hp;
    }
  }
}
(function boot() {
  const q = new URLSearchParams(location.search).get('join');
  startDemo();
  if (q) { App.joinCode = q.toUpperCase().slice(0, 4); history.replaceState(null, '', location.pathname); pickScreen('join'); }
  else menuScreen();
  requestAnimationFrame(frame);
})();
</script>
